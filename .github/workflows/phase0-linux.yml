name: Menu bar development graph Linux

# A branch push works before this temporary workflow reaches a fork's default
# branch. workflow_dispatch does not; it is available only after that point.
on:
  push:
    branches: [codex/native-menu-bar-prototype, codex/menu-bar-development-graph]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase0-linux-status-item-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  validate:
    name: Ubuntu 24.04 / ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: kit-library
            command: cargo test --locked --no-default-features --features test-support --lib -p gpui-kit
          - check: kit-ui
            command: cargo test --locked --features test-support --test ui -p gpui-kit
          - check: status-example
            command: cargo check --locked -p status_item
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # Upstream selects stable; pin the version used for local Phase 0.
          toolchain: 1.99.0
          cache-shared-key: phase0-linux-${{ matrix.check }}
          cache-save-if: true
          # Match upstream's setup action default, including Linux warnings.
          rustflags: -D warnings
      - uses: rui314/setup-mold@v1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Verify coherent snapshot pins
        run: |
          bun script/check-gpui-pin.ts --self-test
          bun script/check-gpui-pin.ts
      - name: Install upstream Linux dependencies
        run: script/bootstrap
      - name: Record build identity
        run: |
          {
            git rev-parse HEAD
            uname -a
            rustc --version --verbose
            cargo --version
            cat /etc/os-release
          } | tee phase0-environment.log
      - name: Validate
        run: ${{ matrix.command }} 2>&1 | tee phase0-validation.log
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-linux-${{ matrix.check }}
          path: |
            phase0-environment.log
            phase0-validation.log
          if-no-files-found: ignore
          retention-days: 7
